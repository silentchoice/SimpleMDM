spring:
  application:
    name: mdm
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mdm}}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:mdm}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD}}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
