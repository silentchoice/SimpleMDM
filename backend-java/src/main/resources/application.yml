server:
  port: 18001

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/simple_mdm?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    username: root
    password: ${SIMPLE_MDM_DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${SIMPLE_MDM_JWT_SECRET:change-me-in-production}
    expiration-minutes: 1440
  push:
    success-rate: 0.9
